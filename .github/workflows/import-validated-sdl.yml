name: Import validated SDL source

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download validated standalone source
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            'https://temp.sh/iweRm/sdl-v2.tar.gz' \
            --output /tmp/sdl-v2.tar.gz
          tar -tzf /tmp/sdl-v2.tar.gz >/dev/null

      - name: Replace repository contents
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          tar -xzf /tmp/sdl-v2.tar.gz -C .
          rm -rf .github

      - name: Verify zero Base44 dependencies
        run: |
          set -euo pipefail
          if grep -RniE 'base44|@base44|base44Client|VITE_BASE44|BASE44_' \
            --exclude-dir=.git --exclude-dir=node_modules .; then
            echo 'Base44 reference detected; publication stopped.' >&2
            exit 1
          fi

      - name: Validate production build
        run: |
          set -euo pipefail
          npm ci
          npm run lint
          npm run typecheck
          npm run build

      - name: Publish validated source
        run: |
          set -euo pipefail
          git config user.name 'Sentinels Design Labs'
          git config user.email 'development@sentinelsdesignlab.com'
          git add -A
          git commit -m 'Publish standalone SDL v2 with zero Base44 dependencies'
          git push origin HEAD:main
